<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ユーチューブ要約</title>
  <meta name="description" content="フォロー中のYouTubeチャンネルの新着動画を、AIが日本語で要約して新しい順に一覧します。" />
  <meta name="theme-color" content="#f7f5f0" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <div class="head-row">
      <h1>ユーチューブ要約</h1>
      <a class="portal-link" href="https://git-san-934.github.io/portal/">アプリ一覧へ</a>
    </div>
    <p class="meta">
      <span id="updated">読み込み中…</span>
      <span class="sep">／</span>
      <span class="disclaimer">要約はAIが自動生成したもので、正確性は保証しません</span>
    </p>
    <div class="filter-bar">
      <label for="channel-select">チャンネル</label>
      <select id="channel-select">
        <option value="">すべて</option>
      </select>
    </div>
  </header>

  <main>
    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden>まだ新しい動画の要約はありません。</p>
    <p id="error" class="error" hidden>データを読み込めませんでした。時間をおいて再度お試しください。</p>
  </main>

  <footer>
    <p>
      フォロー中チャンネルの新着動画（公開から数日以内）を自動でチェックし、
      Google Gemini が内容を日本語で要約しています。要約は動画の内容を保証するものではありません。
      正確な内容は各動画をご覧ください。
    </p>
  </footer>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
